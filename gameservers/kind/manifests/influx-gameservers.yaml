---
apiVersion: v1
kind: ConfigMap
metadata:
  name: influx-gameservers-setup
  namespace: hyperbytedb
data:
  setup.sh: |
    #!/bin/sh
    set -eu

    URL="${HYPERBYTEDB_URL:-http://hyperbytedb-proxy:8086}"
    DB="gameservers"

    wait_for_db() {
      i=0
      while [ "$i" -lt 60 ]; do
        if curl -sf "${URL}/ping" >/dev/null; then
          return 0
        fi
        i=$((i + 1))
        sleep 2
      done
      echo "hyperbytedb not reachable at ${URL}" >&2
      return 1
    }

    response_has_error() {
      echo "$1" | grep -q '"error":[^n]' && echo "$1" | grep -qv '"error":null'
    }

    query() {
      body=$(curl -sf -X POST "${URL}/query" --data-urlencode "q=$1") || return 1
      if response_has_error "$body"; then
        echo "$body" >&2
        return 1
      fi
      echo "$body"
    }

    wait_for_db

    echo "creating gameservers database"
    query "CREATE DATABASE ${DB}"

    echo "creating default_high retention policy"
    query "CREATE RETENTION POLICY \"default_high\" ON \"${DB}\" DURATION 52w REPLICATION 1"


---
apiVersion: batch/v1
kind: Job
metadata:
  name: influx-gameservers-setup
  namespace: hyperbytedb
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: influx-gameservers-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: curlimages/curl:8.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HYPERBYTEDB_URL
              value: http://hyperbytedb-proxy:8086
          command: ["/bin/sh", "/scripts/setup.sh"]
          volumeMounts:
            - name: setup-script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: setup-script
          configMap:
            name: influx-gameservers-setup
            defaultMode: 0444

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influx-gameservers
  namespace: hyperbytedb
  labels:
    app: influx-gameservers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influx-gameservers
  template:
    metadata:
      labels:
        app: influx-gameservers
    spec:
      containers:
        - name: ingester
          image: influx-gameservers:local
          imagePullPolicy: Never
          args:
            - --url=http://hyperbytedb-proxy:8086
            - --db=gameservers
            - --create-db
            - --continuous
            - --num-servers=60000
            - --num-machines=12522
            - --action-rows=0
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
